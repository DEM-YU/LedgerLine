services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    environment:
      POSTGRES_USER: ledgerline_owner
      POSTGRES_PASSWORD: dev_owner_password
      POSTGRES_DB: ledgerline
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ledgerline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_owner -d ledgerline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerline_pgdata:
